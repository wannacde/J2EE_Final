<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password – Bookstore</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at top left, #fdf3e7, #f0dcc8 50%, #e2c9ae);
            font-family: Georgia, "Times New Roman", serif;
            color: #2f261d;
            padding: 20px;
        }
        .card {
            width: min(440px, 100%);
            background: rgba(255,252,247,0.95);
            border: 1px solid #dbc4aa;
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 24px 60px rgba(70,44,25,0.14);
        }
        .logo { text-align:center; font-size:2.5rem; margin-bottom:10px; }
        h1 { text-align:center; font-size:1.7rem; color:#87563a; margin-bottom:6px; }
        .subtitle { text-align:center; color:#706253; font-size:0.97rem; margin-bottom:28px; }
        .form-group { margin-bottom:18px; }
        label { display:block; font-weight:600; color:#4a3728; margin-bottom:6px; font-size:0.95rem; }
        input {
            width:100%; padding:12px 16px; border-radius:14px;
            border:1.5px solid #dbc4aa; background:#fffdf9; color:#2f261d;
            font-size:1rem; font-family:inherit; transition:border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline:none; border-color:#87563a; box-shadow:0 0 0 3px rgba(135,86,58,0.12); }
        .error-field { color:#b91c1c; font-size:0.88rem; margin-top:5px; }
        .error-box {
            background:#fef2f2; border:1px solid #fca5a5; border-radius:12px;
            padding:12px 16px; color:#b91c1c; font-size:0.93rem; margin-bottom:18px;
        }
        .success-box {
            background:#f0fdf4; border:1px solid #86efac; border-radius:12px;
            padding:12px 16px; color:#166534; font-size:0.93rem; margin-bottom:18px;
        }
        .invalid-box {
            text-align:center; padding:20px 0;
        }
        .invalid-box .icon { font-size:3rem; margin-bottom:12px; }
        .invalid-box p { color:#706253; margin-bottom:16px; line-height:1.6; }
        .btn-primary {
            width:100%; padding:13px; border-radius:14px; border:none;
            background:linear-gradient(135deg,#87563a,#a06a4a);
            color:#fff; font-size:1.05rem; font-weight:bold; cursor:pointer;
            font-family:inherit; transition:all 0.2s; margin-top:6px;
        }
        .btn-primary:hover { background:linear-gradient(135deg,#9a6344,#b57a58); transform:translateY(-1px); box-shadow:0 6px 20px rgba(135,86,58,0.3); }
        .divider { border:none; border-top:1px solid #e8d8c4; margin:22px 0; }
        .back-link { display:block; text-align:center; color:#87563a; text-decoration:none; font-weight:500; font-size:0.95rem; }
        .back-link:hover { text-decoration:underline; }
        .btn-outline {
            display:inline-block; padding:11px 24px; border-radius:12px;
            border:1.5px solid #87563a; color:#87563a; font-weight:600;
            text-decoration:none; transition:all 0.2s; font-size:0.95rem;
        }
        .btn-outline:hover { background:#87563a; color:#fff; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🔒</div>
    <h1>Reset Password</h1>

    <div th:if="${!tokenValid}" class="invalid-box">
        <div class="icon">⚠️</div>
        <p>This reset link is <strong>invalid or has expired</strong>.<br>Please request a new one.</p>
        <a th:href="@{/forgot-password}" class="btn-outline">Request New Link</a>
    </div>

    <div th:if="${tokenValid}">
        <p class="subtitle">Enter your new password below.</p>
        <div th:if="${message}" class="success-box" th:text="${message}"></div>
        <div th:if="${error}" class="error-box" th:text="${error}"></div>

        <form th:action="@{/reset-password}" th:object="${resetPasswordRequest}" method="post">
            <input type="hidden" th:field="*{token}">
            <div class="form-group">
                <label for="password">New Password</label>
                <input type="password" id="password" th:field="*{password}" placeholder="At least 6 characters" required autofocus>
                <div class="error-field" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>
            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="Re-enter new password" required>
                <div class="error-field" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>
            <button type="submit" class="btn-primary">Reset Password</button>
        </form>

        <hr class="divider">
        <a class="back-link" th:href="@{/login}">← Back to login</a>
    </div>
</div>
</body>
</html>
