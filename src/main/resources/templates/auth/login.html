<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – Bookstore</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at top left, #fdf3e7, #f0dcc8 50%, #e2c9ae);
            font-family: Georgia, "Times New Roman", serif;
            color: #2f261d;
            padding: 20px;
        }
        .card {
            width: min(440px, 100%);
            background: rgba(255,252,247,0.95);
            border: 1px solid #dbc4aa;
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 24px 60px rgba(70,44,25,0.14);
            backdrop-filter: blur(10px);
        }
        .logo { text-align:center; font-size:2rem; margin-bottom:6px; }
        h1 { text-align:center; font-size:1.7rem; color:#87563a; margin-bottom:6px; }
        .subtitle { text-align:center; color:#706253; font-size:0.97rem; margin-bottom:28px; }
        .form-group { margin-bottom:18px; }
        label { display:block; font-weight:600; color:#4a3728; margin-bottom:6px; font-size:0.95rem; }
        input {
            width:100%; padding:12px 16px; border-radius:14px;
            border:1.5px solid #dbc4aa; background:#fffdf9; color:#2f261d;
            font-size:1rem; font-family:inherit; transition:border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline:none; border-color:#87563a; box-shadow:0 0 0 3px rgba(135,86,58,0.12); }
        .btn-primary {
            width:100%; padding:13px; border-radius:14px; border:none;
            background:linear-gradient(135deg,#87563a,#a06a4a);
            color:#fff; font-size:1.05rem; font-weight:bold; cursor:pointer;
            font-family:inherit; transition:all 0.2s; margin-top:6px;
        }
        .btn-primary:hover { background:linear-gradient(135deg,#9a6344,#b57a58); transform:translateY(-1px); box-shadow:0 6px 20px rgba(135,86,58,0.3); }
        .error-box {
            background:#fef2f2; border:1px solid #fca5a5; border-radius:10px;
            padding:10px 14px; color:#b91c1c; font-size:0.93rem; margin-bottom:16px;
        }
        .success-box {
            background:#f0fdf4; border:1px solid #86efac; border-radius:10px;
            padding:10px 14px; color:#166534; font-size:0.93rem; margin-bottom:16px;
        }
        .divider { border:none; border-top:1px solid #e8d8c4; margin:22px 0; }
        .links { display:flex; flex-direction:column; gap:10px; align-items:center; }
        .links a { color:#87563a; text-decoration:none; font-size:0.95rem; font-weight:500; }
        .links a:hover { text-decoration:underline; }
        .links .signup-link {
            display:inline-block; padding:10px 24px; border-radius:12px;
            border:1.5px solid #87563a; color:#87563a; font-weight:600; transition:all 0.2s;
        }
        .links .signup-link:hover { background:#87563a; color:#fff; text-decoration:none; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">📚</div>
    <h1>Welcome back</h1>
    <p class="subtitle">Login to continue your cart and checkout.</p>

    <div th:if="${param.error}" class="error-box">Invalid username or password. Please try again.</div>
    <div th:if="${param.logout}" class="success-box">You have been logged out successfully.</div>
    <div th:if="${message}" class="success-box" th:text="${message}"></div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" required autofocus>
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>
        </div>
        <button type="submit" class="btn-primary">Login</button>
    </form>

    <hr class="divider">
    <div class="links">
        <a th:href="@{/forgot-password}">Forgot password?</a>
        <a th:href="@{/signup}" class="signup-link">Create a new account</a>
        <a th:href="@{/books}">← Back to book list</a>
    </div>
</div>
</body>
</html>
