<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password – Bookstore</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: radial-gradient(ellipse at top left, #fdf3e7, #f0dcc8 50%, #e2c9ae);
            font-family: Georgia, "Times New Roman", serif;
            color: #2f261d;
            padding: 20px;
        }
        .card {
            width: min(440px, 100%);
            background: rgba(255,252,247,0.95);
            border: 1px solid #dbc4aa;
            border-radius: 28px;
            padding: 40px 36px;
            box-shadow: 0 24px 60px rgba(70,44,25,0.14);
        }
        .logo { text-align:center; font-size:2.5rem; margin-bottom:10px; }
        h1 { text-align:center; font-size:1.7rem; color:#87563a; margin-bottom:6px; }
        .subtitle { text-align:center; color:#706253; font-size:0.97rem; margin-bottom:28px; line-height:1.6; }
        .form-group { margin-bottom:18px; }
        label { display:block; font-weight:600; color:#4a3728; margin-bottom:6px; font-size:0.95rem; }
        input {
            width:100%; padding:12px 16px; border-radius:14px;
            border:1.5px solid #dbc4aa; background:#fffdf9; color:#2f261d;
            font-size:1rem; font-family:inherit; transition:border-color 0.2s, box-shadow 0.2s;
        }
        input:focus { outline:none; border-color:#87563a; box-shadow:0 0 0 3px rgba(135,86,58,0.12); }
        .error-field { color:#b91c1c; font-size:0.88rem; margin-top:5px; }
        .success-box {
            background:#f0fdf4; border:1px solid #86efac; border-radius:12px;
            padding:14px 16px; color:#166534; font-size:0.95rem; margin-bottom:20px;
            display:flex; align-items:center; gap:8px;
        }
        .btn-primary {
            width:100%; padding:13px; border-radius:14px; border:none;
            background:linear-gradient(135deg,#87563a,#a06a4a);
            color:#fff; font-size:1.05rem; font-weight:bold; cursor:pointer;
            font-family:inherit; transition:all 0.2s; margin-top:6px;
        }
        .btn-primary:hover { background:linear-gradient(135deg,#9a6344,#b57a58); transform:translateY(-1px); box-shadow:0 6px 20px rgba(135,86,58,0.3); }
        .divider { border:none; border-top:1px solid #e8d8c4; margin:22px 0; }
        .back-link { display:block; text-align:center; color:#87563a; text-decoration:none; font-weight:500; font-size:0.95rem; }
        .back-link:hover { text-decoration:underline; }
    </style>
</head>
<body>
<div class="card">
    <div class="logo">🔑</div>
    <h1>Forgot Password</h1>
    <p class="subtitle">Enter your account email and we'll send you a reset link.</p>

    <div th:if="${message}" class="success-box">
        <span>✅</span> <span th:text="${message}"></span>
    </div>

    <form th:action="@{/forgot-password}" th:object="${forgotPasswordRequest}" method="post">
        <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" th:field="*{email}" placeholder="your@email.com" required autofocus>
            <div class="error-field" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <button type="submit" class="btn-primary">Send Reset Link</button>
    </form>

    <hr class="divider">
    <a class="back-link" th:href="@{/login}">← Back to login</a>
</div>
</body>
</html>
