<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Discount Code – Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f7efe6; --surface: #fffaf4; --line: #e3d2be;
            --text: #2f261d; --muted: #706253; --accent: #87563a;
        }
        body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); }

        /* Admin Navbar */
        .admin-nav {
            background: #2f261d; padding: 0; position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .admin-nav-inner {
            width: min(1100px, 96vw); margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding: 0 12px;
        }
        .admin-brand { font-size: 1.3rem; font-weight: 700; color: #e8c99a; text-decoration: none; letter-spacing: 1px; }
        .admin-nav-links { display: flex; gap: 6px; }
        .admin-nav-links a {
            padding: 7px 14px; border-radius: 8px; color: #d4b896; text-decoration: none;
            font-size: 0.9rem; font-weight: 500; transition: all 0.18s;
        }
        .admin-nav-links a:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .admin-nav-links a.active { background: var(--accent); color: #fff; }

        .container { width: min(580px, calc(100% - 32px)); margin: 32px auto 48px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 0.95rem; text-decoration: none; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }

        .form-card {
            background: var(--surface); border-radius: 22px; border: 1px solid var(--line);
            box-shadow: 0 6px 24px rgba(70,44,25,0.08); padding: 36px 32px;
        }
        .form-card h1 { font-size: 1.7rem; margin-bottom: 28px; }

        .form-group { margin-bottom: 20px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .form-group label { display: block; font-weight: 600; color: var(--muted); margin-bottom: 7px; font-size: 0.88rem; text-transform: uppercase; letter-spacing: 0.4px; }
        .form-group input, .form-group select {
            width: 100%; padding: 11px 14px; border-radius: 12px;
            border: 1.5px solid var(--line); background: #fffdf9; color: var(--text);
            font-size: 0.97rem; font-family: inherit; transition: border-color 0.2s, box-shadow 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(135,86,58,0.1);
        }
        .hint { font-size: 0.82rem; color: var(--muted); margin-top: 5px; }

        .form-actions { display: flex; gap: 12px; margin-top: 28px; padding-top: 22px; border-top: 1px solid var(--line); }
        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 12px 24px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; border: 1.5px solid transparent; font-family: inherit; transition: all 0.18s; text-decoration: none; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); flex: 1; }
        .btn-primary:hover { background: #9a6344; transform: translateY(-1px); box-shadow: 0 4px 14px rgba(135,86,58,0.3); }
        .btn-ghost { background: #fff; color: var(--text); border-color: var(--line); }
        .btn-ghost:hover { background: #f3e5d5; border-color: #c9a882; }

        @media (max-width: 600px) {
            .form-card { padding: 22px 16px; }
            .form-row { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<!-- Admin Navbar -->
<nav class="admin-nav">
    <div class="admin-nav-inner">
        <a class="admin-brand" th:href="@{/admin/books}">⚙ ADMIN PANEL</a>
        <div class="admin-nav-links">
            <a th:href="@{/admin/books}">📚 Books</a>
            <a th:href="@{/admin/analytics}">📊 Analytics</a>
            <a th:href="@{/discount-codes/admin}" class="active">🏷 Discounts</a>
            <a th:href="@{/books}">🌐 View Store</a>
        </div>
    </div>
</nav>

<div class="container">
    <a class="back-link" th:href="@{/discount-codes/admin}">← Back to Discount Codes</a>

    <div class="form-card">
        <h1>🏷 Create Discount Code</h1>

        <form th:action="@{/discount-codes/admin/create}" th:object="${discountCode}" method="post">
            <div class="form-group">
                <label>Code *</label>
                <input type="text" th:field="*{code}" required placeholder="e.g. SUMMER2025" style="text-transform:uppercase;">
                <div class="hint">Customers will enter this code at checkout.</div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Discount Amount *</label>
                    <input type="number" th:field="*{discountAmount}" step="0.01" min="0" required placeholder="e.g. 50000">
                </div>
                <div class="form-group">
                    <label>Discount Type *</label>
                    <select th:field="*{percentage}">
                        <option th:value="false">Fixed Amount (₫)</option>
                        <option th:value="true">Percentage (%)</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Valid From</label>
                    <input type="datetime-local" th:field="*{validFrom}">
                </div>
                <div class="form-group">
                    <label>Valid To</label>
                    <input type="datetime-local" th:field="*{validTo}">
                </div>
            </div>

            <div class="form-group">
                <label>Usage Limit</label>
                <input type="number" th:field="*{usageLimit}" min="0" placeholder="0 = unlimited">
                <div class="hint">Set to 0 for unlimited usage.</div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Create Code</button>
                <a th:href="@{/discount-codes/admin}" class="btn btn-ghost">Cancel</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
