<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Codes – Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f7efe6; --surface: #fffaf4; --line: #e3d2be;
            --text: #2f261d; --muted: #706253; --accent: #87563a; --danger: #b91c1c;
        }
        body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); }

        /* Admin Navbar */
        .admin-nav {
            background: #2f261d; color: #f5e6d3; padding: 0;
            position: sticky; top: 0; z-index: 100;
            box-shadow: 0 2px 12px rgba(0,0,0,0.2);
        }
        .admin-nav-inner {
            width: min(1100px, 96vw); margin: 0 auto;
            display: flex; justify-content: space-between; align-items: center; min-height: 60px; padding: 0 12px;
        }
        .admin-brand { font-size: 1.3rem; font-weight: 700; color: #e8c99a; text-decoration: none; letter-spacing: 1px; }
        .admin-nav-links { display: flex; gap: 6px; align-items: center; }
        .admin-nav-links a {
            padding: 7px 14px; border-radius: 8px; color: #d4b896; text-decoration: none;
            font-size: 0.9rem; font-weight: 500; transition: all 0.18s;
        }
        .admin-nav-links a:hover { background: rgba(255,255,255,0.12); color: #fff; }
        .admin-nav-links a.active { background: var(--accent); color: #fff; }

        .container { width: min(1000px, calc(100% - 32px)); margin: 32px auto 48px; }
        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 0.95rem; text-decoration: none; margin-bottom: 20px; }
        .back-link:hover { text-decoration: underline; }

        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 12px; }
        .page-header h1 { font-size: 1.8rem; }

        .table-card {
            background: var(--surface); border-radius: 18px; border: 1px solid var(--line);
            box-shadow: 0 4px 18px rgba(70,44,25,0.07); overflow: hidden;
        }
        table { width: 100%; border-collapse: collapse; }
        thead th {
            background: #f3e7d7; color: var(--muted); font-size: 0.82rem;
            font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;
            padding: 14px 16px; text-align: left; border-bottom: 2px solid var(--line);
        }
        tbody tr { transition: background 0.15s; }
        tbody tr:hover { background: #fdf5ec; }
        tbody td { padding: 14px 16px; border-bottom: 1px solid #f0e4d4; font-size: 0.95rem; vertical-align: middle; }
        tbody tr:last-child td { border-bottom: none; }

        .code-cell { font-family: monospace; font-size: 1rem; font-weight: 700; color: var(--accent); background: #f3e7d7; padding: 4px 10px; border-radius: 8px; display: inline-block; }
        .type-badge { padding: 3px 10px; border-radius: 10px; font-size: 0.8rem; font-weight: 700; }
        .type-percent { background: #ede9fe; color: #5b21b6; }
        .type-fixed   { background: #dbeafe; color: #1e40af; }
        .usage-bar-wrap { display: flex; align-items: center; gap: 8px; }
        .usage-bar { height: 6px; border-radius: 3px; background: #e3d2be; flex: 1; overflow: hidden; }
        .usage-bar-fill { height: 100%; border-radius: 3px; background: var(--accent); }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 7px 14px; border-radius: 8px; font-size: 0.88rem; font-weight: 600; cursor: pointer; border: 1.5px solid transparent; font-family: inherit; transition: all 0.18s; text-decoration: none; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: #9a6344; }
        .btn-lg { padding: 11px 22px; font-size: 0.97rem; border-radius: 12px; }
        .btn-danger { background: #fff; color: var(--danger); border-color: #f5c6c6; }
        .btn-danger:hover { background: #fef2f2; }

        .empty-row td { text-align: center; padding: 40px; color: var(--muted); }

        @media (max-width: 700px) {
            thead th:nth-child(4), tbody td:nth-child(4),
            thead th:nth-child(5), tbody td:nth-child(5) { display: none; }
        }
    </style>
</head>
<body>

<!-- Admin Navbar -->
<nav class="admin-nav">
    <div class="admin-nav-inner">
        <a class="admin-brand" th:href="@{/admin/books}">⚙ ADMIN PANEL</a>
        <div class="admin-nav-links">
            <a th:href="@{/admin/books}">📚 Books</a>
            <a th:href="@{/admin/analytics}">📊 Analytics</a>
            <a th:href="@{/discount-codes/admin}" class="active">🏷 Discounts</a>
            <a th:href="@{/books}">🌐 View Store</a>
        </div>
    </div>
</nav>

<div class="container">
    <a class="back-link" th:href="@{/admin/books}">← Back to Books</a>

    <div class="page-header">
        <h1>🏷 Discount Codes</h1>
        <a th:href="@{/discount-codes/admin/create}" class="btn btn-primary btn-lg">+ Create New Code</a>
    </div>

    <div class="table-card">
        <table>
            <thead>
            <tr>
                <th>Code</th>
                <th>Amount</th>
                <th>Type</th>
                <th>Valid From</th>
                <th>Valid To</th>
                <th>Usage</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(codes)}" class="empty-row">
                <td colspan="7">No discount codes yet. Create one!</td>
            </tr>
            <tr th:each="code : ${codes}">
                <td><span class="code-cell" th:text="${code.code}"></span></td>
                <td>
                    <strong th:text="${code.percentage} ? ${code.discountAmount} + '%' : ${#numbers.formatDecimal(code.discountAmount,0,'COMMA',0,'POINT')} + ' ₫'"></strong>
                </td>
                <td>
                    <span class="type-badge" th:classappend="${code.percentage} ? 'type-percent' : 'type-fixed'"
                          th:text="${code.percentage} ? 'Percent' : 'Fixed'"></span>
                </td>
                <td th:text="${code.validFrom}"></td>
                <td th:text="${code.validTo}"></td>
                <td>
                    <div class="usage-bar-wrap">
                        <span th:text="${code.usedCount} + '/' + ${code.usageLimit}"></span>
                        <div class="usage-bar" th:if="${code.usageLimit > 0}">
                            <div class="usage-bar-fill"
                                 th:style="'width:' + ${code.usageLimit > 0 ? (code.usedCount * 100 / code.usageLimit) : 0} + '%'"></div>
                        </div>
                    </div>
                </td>
                <td>
                    <form th:action="@{'/discount-codes/admin/delete/' + ${code.id}}" method="post" style="margin:0;">
                        <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this code?')"><i class="fa-solid fa-trash"></i> Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
