<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Tracking – Bookstore</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #f7efe6; --surface: #fffaf4; --line: #e3d2be;
            --text: #2f261d; --muted: #706253; --accent: #87563a; --accent-2: #40614f;
        }
        body { font-family: Georgia, "Times New Roman", serif; background: var(--bg); color: var(--text); }
        .container { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 28px 0 48px; }

        .back-link { display: inline-flex; align-items: center; gap: 6px; color: var(--accent); font-weight: 600; font-size: 0.95rem; text-decoration: none; margin-bottom: 22px; }
        .back-link:hover { text-decoration: underline; }

        .card {
            background: var(--surface); border-radius: 22px; border: 1px solid var(--line);
            box-shadow: 0 6px 24px rgba(70,44,25,0.08); padding: 28px 26px; margin-bottom: 20px;
        }

        /* Order Header */
        .order-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; flex-wrap: wrap; gap: 12px; }
        .order-title { font-size: 1.7rem; font-weight: 700; }
        .order-title span { color: var(--accent); }

        .badge { padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .badge-pending   { background: #fef9c3; color: #854d0e; }
        .badge-confirmed { background: #dbeafe; color: #1e40af; }
        .badge-shipping  { background: #ede9fe; color: #5b21b6; }
        .badge-delivered { background: #dcfce7; color: #166534; }
        .badge-cancelled { background: #fee2e2; color: #991b1b; }
        .badge-default   { background: #f3f4f6; color: #374151; }

        .alert { border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; font-size: 0.95rem; }
        .alert-success { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
        .alert-error   { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; }

        /* Info Grid */
        .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
        .info-item { background: #fff; border-radius: 12px; border: 1px solid var(--line); padding: 14px 16px; }
        .info-item .info-label { font-size: 0.8rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 5px; }
        .info-item .info-value { font-size: 1rem; font-weight: 600; color: var(--text); }

        .total-row { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; background: #f3e7d7; border-radius: 12px; margin-top: 4px; }
        .total-row .label { font-size: 1rem; font-weight: 600; color: var(--muted); }
        .total-row .amount { font-size: 1.3rem; font-weight: 700; color: var(--accent); }

        .btn { display: inline-flex; align-items: center; justify-content: center; padding: 11px 22px; border-radius: 12px; font-size: 0.97rem; font-weight: 600; cursor: pointer; border: 1.5px solid transparent; font-family: inherit; transition: all 0.18s; text-decoration: none; }
        .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
        .btn-primary:hover { background: #9a6344; transform: translateY(-1px); }
        .btn-ghost { background: #fff; color: var(--text); border-color: var(--line); }
        .btn-ghost:hover { background: #f3e5d5; border-color: #c9a882; }

        /* Timeline */
        .card h2 { font-size: 1.2rem; margin-bottom: 20px; }
        .timeline { position: relative; padding-left: 28px; }
        .timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 2px; background: var(--line); }
        .timeline-item { position: relative; margin-bottom: 20px; }
        .timeline-item:last-child { margin-bottom: 0; }
        .timeline-dot {
            position: absolute; left: -24px; top: 4px;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--surface);
            box-shadow: 0 0 0 2px var(--accent);
        }
        .timeline-status { font-weight: 700; color: var(--accent); font-size: 0.97rem; margin-bottom: 3px; }
        .timeline-by { font-size: 0.88rem; color: var(--muted); margin-bottom: 2px; }
        .timeline-time { font-size: 0.85rem; color: #aaa; }
        .timeline-note { font-size: 0.9rem; color: var(--text); margin-top: 4px; font-style: italic; }
        .timeline-empty { color: var(--muted); font-size: 0.95rem; text-align: center; padding: 20px 0; }

        @media (max-width: 600px) {
            .info-grid { grid-template-columns: 1fr; }
            .card { padding: 18px 14px; }
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <a class="back-link" th:href="@{/orders}">← Back to Orders</a>

    <!-- Order Info Card -->
    <div class="card">
        <div class="order-header">
            <div class="order-title">Order <span th:text="'#' + ${order.id}"></span></div>
            <span class="badge"
                  th:classappend="${order.status.name() == 'PENDING'} ? 'badge-pending' :
                                  (${order.status.name() == 'CONFIRMED'} ? 'badge-confirmed' :
                                  (${order.status.name() == 'SHIPPING'} ? 'badge-shipping' :
                                  (${order.status.name() == 'DELIVERED'} ? 'badge-delivered' :
                                  (${order.status.name() == 'CANCELLED'} ? 'badge-cancelled' : 'badge-default'))))"
                  th:text="${order.status}"></span>
        </div>

        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

        <div class="info-grid">
            <div class="info-item">
                <div class="info-label">👤 Recipient</div>
                <div class="info-value" th:text="${order.customerName}"></div>
            </div>
            <div class="info-item">
                <div class="info-label">📞 Phone</div>
                <div class="info-value" th:text="${order.phoneNumber != null ? order.phoneNumber : 'N/A'}"></div>
            </div>
            <div class="info-item">
                <div class="info-label">📅 Order Date</div>
                <div class="info-value" th:text="${#temporals.format(order.createdAt,'dd MMM yyyy, HH:mm')}"></div>
            </div>
            <div class="info-item" style="grid-column: 1 / -1;">
                <div class="info-label">📍 Shipping Address</div>
                <div class="info-value" th:text="${order.address}"></div>
            </div>
            <div class="info-item" th:if="${order.trackingNumber != null}">
                <div class="info-label">🚚 Tracking Number</div>
                <div class="info-value" th:text="${order.trackingNumber}"></div>
            </div>
        </div>

        <div class="total-row">
            <span class="label">Total Amount</span>
            <span class="amount" th:text="${#numbers.formatDecimal(order.totalAmount,0,'COMMA',0,'POINT')} + ' ₫'"></span>
        </div>

        <!-- Order Items -->
        <div style="margin-top:20px;">
            <div style="font-size:0.85rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; margin-bottom:10px;">Items Ordered</div>
            <div th:each="detail : ${order.orderDetails}" style="display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #f0e4d4;">
                <div>
                    <div style="font-weight:600;" th:text="${detail.bookTitle}"></div>
                    <div style="font-size:0.88rem; color:var(--muted);" th:text="${#numbers.formatDecimal(detail.unitPrice,0,'COMMA',0,'POINT')} + ' ₫ × ' + ${detail.quantity}"></div>
                </div>
                <div style="font-weight:700; color:var(--accent);" th:text="${#numbers.formatDecimal(detail.lineTotal,0,'COMMA',0,'POINT')} + ' ₫'"></div>
            </div>
        </div>

        <form th:if="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}"
              th:action="@{'/orders/' + ${order.id} + '/advance-status'}" method="post"
              style="margin-top:18px;">
            <button type="submit" class="btn btn-primary">Advance Status (Demo) →</button>
        </form>
        <form th:if="${order.status.name() == 'PENDING' or order.status.name() == 'PROCESSING'}"
              th:action="@{'/orders/' + ${order.id} + '/cancel'}" method="post"
              style="margin-top:10px;"
              onsubmit="return confirm('Are you sure you want to cancel this order?')">
            <button type="submit" class="btn btn-ghost" style="color:#b91c1c; border-color:#fca5a5;">Cancel Order</button>
        </form>
    </div>

    <!-- Status History Card -->
    <div class="card">
        <h2>📋 Status History</h2>
        <div class="timeline-empty" th:if="${#lists.isEmpty(statusHistory)}">No history yet.</div>
        <div class="timeline" th:if="${!#lists.isEmpty(statusHistory)}">
            <div class="timeline-item" th:each="h : ${statusHistory}">
                <div class="timeline-dot"></div>
                <div class="timeline-status" th:text="${h.status}"></div>
                <div class="timeline-by">by <span th:text="${h.changedBy}"></span></div>
                <div class="timeline-time" th:text="${#temporals.format(h.changedAt,'dd MMM yyyy, HH:mm:ss')}"></div>
                <div class="timeline-note" th:if="${h.note != null}" th:text="${h.note}"></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
