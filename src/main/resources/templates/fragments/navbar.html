<!-- fragments/navbar.html -->
<nav class="user-navbar" xmlns:th="http://www.thymeleaf.org"
     xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
     th:fragment="navbar"
     style="background:#fffaf3; border-bottom:2px solid #e2d2be; padding:0; margin-bottom:0; position:sticky; top:0; z-index:100; box-shadow:0 2px 12px rgba(71,49,16,0.08);">
    <div style="width:min(1100px,96vw); margin:0 auto; display:flex; justify-content:space-between; align-items:center; min-height:64px; padding:0 12px;">
        <a th:href="@{/books}" style="font-size:1.7rem; font-weight:bold; color:#87563a; text-decoration:none; letter-spacing:2px; display:flex; align-items:center; gap:8px;">
                <i class="fa-solid fa-book icon" aria-hidden="true"></i> BOOKSTORE
        </a>
        <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap;">
                <a th:href="@{/books}" class="nav-pill"><i class="fa-solid fa-house icon"></i> Home</a>
                <a th:href="@{/cart}" class="nav-pill"><i class="fa-solid fa-cart-shopping icon"></i> Cart (<span th:text="${cartCount}">0</span>)</a>
                <a th:href="@{/wishlist}" class="nav-pill" sec:authorize="isAuthenticated()"><i class="fa-regular fa-heart icon"></i> Wishlist</a>
                <a th:href="@{/orders}" class="nav-pill" sec:authorize="isAuthenticated()"><i class="fa-solid fa-box icon"></i> Orders</a>
                <a th:href="@{/profile}" class="nav-pill" sec:authorize="isAuthenticated()"><i class="fa-solid fa-user icon"></i> Profile</a>
                <span sec:authorize="isAuthenticated()" class="nav-pill nav-user"><i class="fa-solid fa-user-circle icon"></i> <strong sec:authentication="name">user</strong></span>
                <a sec:authorize="!isAuthenticated()" class="nav-pill nav-login" th:href="@{/login}"><i class="fa-solid fa-right-to-bracket icon"></i> Login</a>
                <form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post" style="margin:0;">
                    <button type="submit" class="nav-pill nav-logout"><i class="fa-solid fa-arrow-right-from-bracket icon"></i> Logout</button>
                </form>
        </div>
    </div>
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link rel="stylesheet" href="/static/bookstore-ui.css">
</nav>
